<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>테스트 웹페이지</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f4f4;
            color: #222;
            transition: 0.3s;
        }

        header {
            background: #333;
            color: white;
            padding: 20px;
            text-align: center;
        }

        .container {
            max-width: 800px;
            margin: 30px auto;
            padding: 20px;
        }

        .card {
            background: white;
            padding: 25px;
            margin-bottom: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        }

        h2 {
            margin-top: 0;
        }

        input {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 16px;
        }

        button {
            padding: 12px 18px;
            margin: 5px;
            border: none;
            border-radius: 6px;
            background: #333;
            color: white;
            cursor: pointer;
            font-size: 15px;
        }

        button:hover {
            background: #555;
        }

        #result {
            margin-top: 15px;
            font-size: 20px;
            font-weight: bold;
        }

        .dark {
            background: #181818;
            color: white;
        }

        .dark .card {
            background: #292929;
        }

        footer {
            text-align: center;
            padding: 20px;
            color: #777;
        }
    </style>
</head>

<body>

    <header>
        <h1>🧪 테스트 웹페이지</h1>
        <p>HTML + CSS + JavaScript 테스트</p>
    </header>

    <div class="container">

        <!-- 입력 테스트 -->
        <div class="card">
            <h2>1. 입력 테스트</h2>

            <input
                type="text"
                id="name"
                placeholder="이름을 입력하세요"
            >

            <button onclick="sayHello()">인사하기</button>

            <p id="hello"></p>
        </div>

        <!-- 랜덤 숫자 -->
        <div class="card">
            <h2>2. 랜덤 숫자 테스트</h2>

            <button onclick="randomNumber()">
                랜덤 숫자 생성
            </button>

            <div id="result">결과: -</div>
        </div>

        <!-- 카운터 -->
        <div class="card">
            <h2>3. 카운터 테스트</h2>

            <button onclick="changeCount(-1)">−</button>
            <span id="count">0</span>
            <button onclick="changeCount(1)">+</button>

            <br>

            <button onclick="resetCount()">초기화</button>
        </div>

        <!-- 다크모드 -->
        <div class="card">
            <h2>4. 화면 테스트</h2>

            <button onclick="toggleDarkMode()">
                🌙 다크모드 전환
            </button>
        </div>

    </div>

    <footer>
        테스트용 웹페이지
    </footer>


    <script>

        // 인사하기
        function sayHello() {

            const name = document.getElementById("name").value;

            if (name === "") {
                document.getElementById("hello").textContent =
                    "이름을 입력해주세요!";
                return;
            }

            document.getElementById("hello").textContent =
                "안녕하세요, " + name + "님!";
        }


        // 랜덤 숫자
        function randomNumber() {

            const number =
                Math.floor(Math.random() * 100) + 1;

            document.getElementById("result").textContent =
                "결과: " + number;
        }


        // 카운터
        let count = 0;

        function changeCount(value) {

            count += value;

            document.getElementById("count").textContent =
                count;
        }


        // 카운터 초기화
        function resetCount() {

            count = 0;

            document.getElementById("count").textContent =
                count;
        }


        // 다크모드
        function toggleDarkMode() {

            document.body.classList.toggle("dark");
        }

    </script>

</body>
</html>
